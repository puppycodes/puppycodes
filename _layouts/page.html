---
layout: default
---

<div class="wrapper archive">
  {{ content }}
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var pageLinks = document.querySelectorAll('.page-link');
    var pathWithoutBaseUrl = window.location.pathname.replace('{{ site.baseurl }}', '') || '/';
    
    pageLinks.forEach(function(link) {
        var href = link.getAttribute('href').replace('{{ site.baseurl }}', '');
        if (href === pathWithoutBaseUrl) {
            link.classList.add('active');
        }
    });
});
</script>
